<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Wheel Shop Estimate Pro — fast, professional repair estimates for wheel, tire, and automotive shops. Works offline.">
  <meta name="theme-color" content="#0f2a43">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Estimate Pro">
  <title>Wheel Shop Estimate Pro</title>
  <script>
  try{(function(){var s=localStorage.getItem('wse-theme');var t=(s==='dark'||s==='light')?s:((window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();}catch(e){}
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <div id="app">
    <header class="app-header no-print" id="appHeader">
      <div class="brand">
        <img id="brandLogo" class="brand-logo" alt="" hidden>
        <svg class="brand-mark" id="brandMark" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="21" fill="#18181b" stroke="#f97316" stroke-width="3"/>
          <circle cx="24" cy="24" r="12" fill="#d4d4d8"/>
          <g stroke="#52525b" stroke-width="3.4" stroke-linecap="round">
            <line x1="24" y1="24" x2="24" y2="13.5"/>
            <line x1="24" y1="24" x2="33.9" y2="20.9"/>
            <line x1="24" y1="24" x2="30.2" y2="31.9"/>
            <line x1="24" y1="24" x2="17.8" y2="31.9"/>
            <line x1="24" y1="24" x2="14.1" y2="20.9"/>
          </g>
          <circle cx="24" cy="24" r="3.4" fill="#f97316"/>
        </svg>
        <div class="brand-text">
          <span class="brand-name">Wheel Shop Estimate Pro</span>
          <span class="brand-sub" id="brandShopName">Your shop</span>
        </div>
      </div>
      <div class="header-actions">
      <button type="button" id="installBtn" class="btn btn-install" hidden>Install app</button>
      <button type="button" id="themeBtn" class="btn btn-install theme-btn" aria-label="Switch to dark theme">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" width="20" height="20"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" width="20" height="20"><circle cx="12" cy="12" r="4.4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.3 4.3l1.7 1.7M18 18l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.3 19.7l1.7-1.7M18 6l1.7-1.7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      </div>
    </header>

    <main id="main" tabindex="-1">
      <div id="screen" class="screen"></div>
    </main>

    <nav class="tab-bar no-print" id="tabBar" aria-label="Primary">
      <button type="button" class="tab" data-route="home" aria-label="Home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21H3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 21v-6h6v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <span>Home</span>
      </button>
      <button type="button" class="tab tab-primary" data-route="wizard" aria-label="New estimate">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
        <span>New</span>
      </button>
      <button type="button" class="tab" data-route="saved" aria-label="Saved estimates">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 4v5h6V4M9 20v-7h6v7" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <span>Saved</span>
      </button>
      <button type="button" class="tab" data-route="shop" aria-label="Shop setup">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19 12a7 7 0 0 0-.14-1.4l2-1.55-2-3.46-2.36.95a7 7 0 0 0-2.42-1.4L13.7 2.6h-3.4l-.38 2.54a7 7 0 0 0-2.42 1.4l-2.36-.95-2 3.46 2 1.55a7 7 0 0 0 0 2.8l-2 1.55 2 3.46 2.36-.95a7 7 0 0 0 2.42 1.4l.38 2.54h3.4l.38-2.54a7 7 0 0 0 2.42-1.4l2.36.95 2-3.46-2-1.55c.1-.46.14-.93.14-1.4Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span>Shop</span>
      </button>
    </nav>
  </div>

  <div id="toastRegion" class="toast-region" aria-live="polite" role="status"></div>
  <div id="dialogRoot"></div>
  <div id="lightboxRoot"></div>

  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
